services:
  - type: web
    name: phishing-url-intelligence-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://phishing-url-intelligence.vercel.app"
      - key: PYTHON_VERSION
        value: "3.12.0"
    rootDir: backend
